{% extends "base.html" %}

{% block title %}Calendar - {{ course.name }}{% endblock %}

{% block content %}
<div class="breadcrumbs">
    <a href="/">Home</a> /
    <span>{{ course.name }}</span> /
    <span>Calendar</span>
</div>

<div class="page-header">
    <div>
        <h1 class="page-title">Course Calendar</h1>
        <p class="page-subtitle">{{ course.name }}</p>
    </div>
    <form method="post" action="{% url 'courses:calendar-generate' course.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary"
                onclick="return confirm('Generate calendar sessions for all schedules of this course?');">
            Generate Calendar
        </button>
    </form>
</div>

{% include "courses/partials/calendar_grid.html" %}

<div class="mt-4">
    <a href="{% url 'courses:schedule-list' course.id %}" class="btn btn-secondary">← Back to Schedule</a>
    <a href="{% url 'courses:calendar-delays' course.id %}" class="btn btn-secondary">Delays</a>
</div>

<style>
    .calendar-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        margin: 1rem 0;
    }

    .calendar-nav h2 {
        margin: 0;
        min-width: 220px;
        text-align: center;
    }

    .calendar-fade {
        transition: opacity 250ms ease-out, transform 250ms ease-out;
    }

    .calendar-fade-hidden {
        opacity: 0;
        transform: translateX(12px);
    }

    .calendar-grid {
        table-layout: fixed;
        width: 100%;
    }

    .calendar-grid th {
        text-align: center;
    }

    .calendar-day {
        vertical-align: top;
        height: 100px;
        padding: 0.25rem;
    }

    .calendar-day-empty {
        background: var(--gray-100, #f3f4f6);
    }

    .calendar-day-today {
        background: #fffbe6;
    }

    .calendar-day-number {
        font-weight: 600;
        font-size: 0.875rem;
        margin-bottom: 0.25rem;
    }

    .calendar-session {
        font-size: 0.75rem;
        background: #dbeafe;
        color: #1e3a8a;
        border-radius: 4px;
        padding: 0.125rem 0.375rem;
        margin-bottom: 0.125rem;
        display: flex;
        gap: 0.25rem;
        cursor: pointer;
        transition: background 150ms ease-out;
    }

    .calendar-session:hover {
        filter: brightness(0.95);
    }


    .calendar-session-topic {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .calendar-session-time {
        font-weight: 600;
    }
</style>
{% endblock %}
