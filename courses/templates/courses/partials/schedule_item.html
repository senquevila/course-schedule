{% load static %}

<tr id="schedule-{{ schedule.id }}"
    hx-confirm="Are you sure you want to delete this schedule?">
    <td>
        <span title="{{ schedule.get_days_display }}">
            {{ schedule.get_days_short }}
        </span>
    </td>
    <td>{{ schedule.start_time|time:"H:i" }}</td>
    <td>{{ schedule.end_time|time:"H:i" }}</td>
    <td>
        {{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }}
    </td>
    <td>
        <div class="actions">
            <button class="action-btn action-edit"
                    hx-get="{% url 'courses:schedule-edit' schedule.course.id schedule.id %}"
                    hx-target="#modal-body"
                    onclick="openModal()">
                Edit
            </button>
            <button class="action-btn action-delete"
                    hx-delete="{% url 'courses:schedule-delete' schedule.course.id schedule.id %}"
                    hx-target="#schedule-{{ schedule.id }}"
                    hx-swap="outerHTML swap:1s">
                Delete
            </button>
        </div>
    </td>
</tr>
