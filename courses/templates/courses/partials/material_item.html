<tr id="material-{{ material.id }}"
    hx-confirm="Are you sure you want to delete this material?">
    <td>{{ material.code }}</td>
    <td>{{ material.name }}</td>
    <td>
        <span class="badge badge-{{ material.material_type }}">
            {{ material.get_material_type_display }}
        </span>
    </td>
    <td>
        {% if material.material_type == "url" %}
        <a href="{{ material.url_or_path }}" target="_blank" rel="noopener noreferrer">
            {{ material.url_or_path|truncatewords:5 }}
        </a>
        {% else %}
        <code>{{ material.url_or_path }}</code>
        {% endif %}
    </td>
    <td>
        <div class="actions">
            <button class="action-btn action-edit"
                    hx-get="{% url 'courses:material-edit' material.topic.course.id material.topic.id material.id %}"
                    hx-target="#modal-body"
                    onclick="openModal()">
                Edit
            </button>
            <button class="action-btn action-delete"
                    hx-delete="{% url 'courses:material-delete' material.topic.course.id material.topic.id material.id %}"
                    hx-target="#material-{{ material.id }}"
                    hx-swap="outerHTML swap:1s">
                Delete
            </button>
        </div>
    </td>
</tr>
