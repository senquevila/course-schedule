<tr id="topic-{{ topic.id }}"
    hx-confirm="Are you sure you want to delete this topic?">
    <td>{{ topic.code }}</td>
    <td>{{ topic.name }}</td>
    <td>{{ topic.order }}</td>
    <td>{{ topic.description|truncatewords:10 }}</td>
    <td>
        {% if topic.materials.count %}
        <a href="{% url 'courses:material-list' topic.course.id topic.id %}">
            {{ topic.materials.count }} material{{ topic.materials.count|pluralize }}
        </a>
        {% else %}
        <span class="text-muted">None</span>
        {% endif %}
    </td>
    <td>
        <div class="actions">
            <button class="action-btn action-edit"
                    hx-get="{% url 'courses:topic-edit' topic.course.id topic.id %}"
                    hx-target="#modal-body"
                    onclick="openModal()">
                Edit
            </button>
            <button class="action-btn action-delete"
                    hx-delete="{% url 'courses:topic-delete' topic.course.id topic.id %}"
                    hx-target="#topic-{{ topic.id }}"
                    hx-swap="outerHTML swap:1s">
                Delete
            </button>
        </div>
    </td>
</tr>
