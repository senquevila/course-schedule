<div class="modal-header">
    <h2 class="modal-title">Log for {{ session.session_date }}</h2>
    <button class="modal-close" onclick="closeModal()">×</button>
</div>

<form method="POST"
      hx-post="{% url 'courses:calendar-log-create' session.course_id session.id %}"
      hx-target="#modal-body">
    {% csrf_token %}

    {% for field in form %}
    <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
    </div>
    {% endfor %}

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary"
                hx-get="{% url 'courses:calendar-session-detail' session.course_id session.id %}"
                hx-target="#modal-body">Back</button>
        <button type="submit" class="btn btn-primary">Save Log</button>
    </div>
</form>
